{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task-maanger</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>

<body>
    <h1>My Tasks</h1>

    <!--form to create new tasks-->
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>

    <hr>

    <!--task list-->
    <ul>
        {% for task in tasks %}
        <li>
            {{ task.title }} -
            {% if task.completed %}
            Completed
            {% else %}
            Not Completed
            {% endif %}

            <!--form to toggle completed tasks-->
            <form method="post" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="task_id" value="{{ task.id }}">
                <button type="submit">Toggle Completion</button>
            </form>

            <!-- edit task -->
            <a href="{% url 'task-edit' task.pk %}">Edit</a>

            <!-- delete task -->
            <a href="{% url 'task-delete' task.pk %}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>

</html>
