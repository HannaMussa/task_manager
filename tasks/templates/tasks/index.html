{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task-maanger</title>
    <link rel="stylesheet" href="{% static 'tasks/style.css' %}">
</head>

<body>
    <h1>My Tasks</h1>


    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Add Task</button>
    </form>

    <hr>

    <ul>
        {% for task in tasks %}
        <li>
            {{ task.title }}
            <a href="{% url 'task-delete' task.pk %}">Delete</a>
        </li>
        {% endfor %}
    </ul>
</body>

</html>
